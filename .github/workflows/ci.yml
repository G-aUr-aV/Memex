name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The framework holds no knowledge
        run: |
          if git ls-files -- wiki raw inbox journal notes outputs .memex meta Home.md | grep .; then
            echo "::error::knowledge files are tracked in the framework repo"; exit 1
          fi
          if git ls-files -s | awk '$1 == "160000"' | grep .; then
            echo "::error::an embedded repository (a vault?) is tracked"; exit 1
          fi
      - name: Shell syntax
        run: bash -n setup.sh tools/setup-qmd.sh
      - name: Config templates parse
        run: |
          python -m json.tool config/claude-settings.json.tmpl > /dev/null
          python -m json.tool config/codex-hooks.json.tmpl > /dev/null
          python -m json.tool schema/domains.json > /dev/null
      - name: Tests (temporary framework copy and vault, fake HOME and git config)
        run: python tools/test_memex.py
